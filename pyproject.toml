[project]
name = "sam2-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.15",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
    "transformers>=4.45.0",
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "Pillow>=9.0",
    "qwen-vl-utils>=0.0.8",
    "nvidia-cudnn-cu12>=9.0",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
name = "pytorch-cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }